<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="86" viewBox="0 0 860 86" role="img" aria-labelledby="title desc">
<title>whoami</title>
<desc>Types 'Forward Deployed Engineer &amp; Researcher' once.</desc>
<style><![CDATA[
@keyframes type-line {
  from { clip-path: inset(0 100% 0 0); }
  to { clip-path: inset(0 0 0 0); }
}
.typed { animation: type-line 1.8s steps(38, end) 0.2s both; }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
}
]]></style>
<rect width="860" height="86" rx="10" fill="#1a1b27" stroke="#3b4261"/>
<text x="16" y="34" fill="#9ece6a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">fatih@github ~ $ whoami</text>
<g class="typed">
<text x="16" y="64" fill="#c0caf5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">Forward Deployed Engineer &amp; Researcher<tspan fill="#7aa2f7"> ▌</tspan></text>
</g>
</svg>
