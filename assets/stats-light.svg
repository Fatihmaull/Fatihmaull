<g class="stat" style="animation-delay:0.22s"><rect x="226" y="44" width="196" height="104" rx="10" fill="#d5d6db" stroke="#a8b0d0"/><rect x="226" y="44" width="4" height="104" rx="2" fill="#587539"/><text x="242" y="72" fill="#6172b0" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="13">Current streak</text><text x="242" y="108" fill="#3760bf" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="32" font-weight="700">2</text><text x="242" y="130" fill="#587539" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="13">days</text></g>
<g class="stat" style="animation-delay:0.32s"><rect x="436" y="44" width="196" height="104" rx="10" fill="#d5d6db" stroke="#a8b0d0"/><rect x="436" y="44" width="4" height="104" rx="2" fill="#9854f1"/><text x="452" y="72" fill="#6172b0" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="13">Longest streak</text><text x="452" y="108" fill="#3760bf" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="32" font-weight="700">34</text><text x="452" y="130" fill="#9854f1" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="13">days</text></g>
