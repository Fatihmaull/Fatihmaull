<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="168" viewBox="0 0 860 168" role="img" aria-labelledby="title desc">
<title>Contribution streaks</title>
<desc>Current streak, longest streak, best day, and last-year total from the public contribution calendar.</desc>
<style><![CDATA[
@keyframes stat-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.stat { animation-name: stat-in; animation-duration: 0.45s; animation-timing-function: ease; animation-fill-mode: both; }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
}
]]></style>
<rect width="860" height="168" rx="12" fill="#e1e2e7"/>
<text x="24" y="28" fill="#587539" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">fatih@github ~ $ ./streak.sh</text>
